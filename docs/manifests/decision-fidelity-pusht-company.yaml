node_b:
  stage: N1-infrastructure-smoke
  paper_evidence: false
  question: Are later-state cloned candidate utilities paired, deterministic, and non-degenerate?
  trials: 16
  test_indices: [100, 116]
  family: k32
  policies: [ep100, ep300]
  proposals: 16
  nfe: [1, 4]
